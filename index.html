<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Le Test Cyril</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #1e293b; border-radius: 20px; padding: 24px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1, h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #94a3b8; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1em; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .option-btn { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 12px; text-align: left; color: #fff; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; transition: 0.2s; width: 100%; line-height: 1.4; }
    .option-btn:hover { border-color: #38bdf8; background: #1e293b; }
    .badge { font-weight: bold; padding: 4px 8px; border-radius: 6px; font-size: 0.85em; flex-shrink: 0; }
    .badge-a { background: #3b82f6; color: #fff; }
    .badge-b { background: #f59e0b; color: #fff; }
    .badge-c { background: #ef4444; color: #fff; }
    .progress-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
    .progress-fill { height: 100%; background: #38bdf8; width: 0%; transition: width 0.3s; }
    .screen { display: none; }
    .screen.active { display: block; }
    .result-box { background: #0f172a; padding: 15px; border-radius: 10px; margin: 15px 0; border-left: 4px solid #38bdf8; }
    .stats-container { margin-top: 20px; text-align: center; }
    .question-text { font-size: 1.05em; color: #f1f5f9; margin-bottom: 18px; line-height: 1.4; font-weight: 600; }
  </style>
</head>
<body>

  <div class="card">
    <!-- ÉCRAN 1 : IDENTIFICATION -->
    <div id="screen-1" class="screen active">
      <h1>Le Test Cyril 🚀</h1>
      <form id="user-form">
        <div class="input-group">
          <label>Prénom</label>
          <input type="text" id="prenom" required>
        </div>
        <div class="input-group">
          <label>Nom</label>
          <input type="text" id="nom" required>
        </div>
        <div class="input-group">
          <label>Âge</label>
          <input type="number" id="age" required>
        </div>
        <div class="input-group">
          <label>Profession</label>
          <input type="text" id="profession" required>
        </div>
        <button type="submit" class="btn btn-primary">Commencer le Test</button>
      </form>
    </div>

    <!-- ÉCRAN 2 : QUESTIONNAIRE -->
    <div id="screen-2" class="screen">
      <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
      <h2 id="category-title" style="font-size:0.9em; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; margin-bottom:5px;"></h2>
      <div id="question-text" class="question-text"></div>
      <div id="options-container"></div>
    </div>

    <!-- ÉCRAN 3 : RÉSULTAT INDIVIDUEL -->
    <div id="screen-3" class="screen">
      <h2>Résultat</h2>
      <div class="result-box">
        <h3 id="result-profile"></h3>
        <p id="result-desc" style="margin-top: 8px; font-size: 0.9em; color: #94a3b8;"></p>
      </div>
      <button class="btn btn-primary" onclick="showScreen('screen-4'); renderChart();">Voir les Statistiques Globales</button>
      <button class="btn btn-secondary" onclick="resetForm()">Nouveau Test</button>
    </div>

    <!-- ÉCRAN 4 : DASHBOARD STATISTIQUES -->
    <div id="screen-4" class="screen">
      <h2>Dashboard Global</h2>
      <p style="text-align: center; color: #94a3b8;">Participants totaux : <strong id="total-participants" style="color:#fff;">0</strong></p>
      
      <div class="stats-container">
        <canvas id="statsChart"></canvas>
      </div>

      <button class="btn btn-success" onclick="exportCSV()">Exporter en CSV 📥</button>
      <button class="btn btn-secondary" onclick="resetForm()">Accueil</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const questions = [
      { cat: "🏛️ Politique", q: "La vie politique française (Gauche / Droite / Centre)", choices: [ { value: "A", text: "De vraies visions divergentes qui s'affrontent sur la société, l'économie et la justice sociale." }, { value: "B", text: "Des clivages réels sur les valeurs, mais qui s'atténuent au pouvoir en raison des contraintes budgétaires et internationales." }, { value: "C", text: "Une façade : l'essentiel des directives venant de Bruxelles, les gouvernements mènent la même politique. Les candidats prônant un retour à la souveraineté nationale sont écartés des grands débats." } ] },
      { cat: "🇺🇸 USA", q: "Le rôle des États-Unis dans le monde", choices: [ { value: "A", text: "Le garant indispensable de la sécurité de l'Occident et du monde libre face aux autocraties." }, { value: "B", text: "Une puissance pragmatique qui défend avant tout ses propres intérêts économiques et géopolitiques." }, { value: "C", text: "Une puissance qui maintient son hégémonie en imposant ses normes, sa monnaie et ses alliances, souvent au détriment de l'indépendance des nations européennes." } ] },
      { cat: "🌐 Mondialisation", q: "La mondialisation et le rôle des nations", choices: [ { value: "A", text: "Le libre-échange et l'ouverture sont des opportunités indispensables pour la croissance globale." }, { value: "B", text: "La mondialisation présente des avantages, mais il faut réindustrialiser et protéger certains secteurs stratégiques." }, { value: "C", text: "La dilution des frontières et des souverainetés nationales au profit de grands marchés mondiaux fragilise les peuples et leur indépendance." } ] },
      { cat: "🌱 Climat", q: "La transition écologique et le climat", choices: [ { value: "A", text: "Une urgence absolue qui nécessite une transformation rapide et globale encadrée par les institutions." }, { value: "B", text: "Un enjeu majeur, mais la transition doit rester réaliste sans asphyxier les entreprises et les ménages." }, { value: "C", text: "Un sujet légitime, mais dont la gestion actuelle sert surtout de prétexte pour instaurer de nouvelles taxes et restreindre les libertés individuelles." } ] },
      { cat: "🤖 IA", q: "L'Intelligence Artificielle et le progrès technique", choices: [ { value: "A", text: "Une formidable opportunité d'innovation et de modernisation pour l'ensemble de la société." }, { value: "B", text: "Un outil très puissant qui nécessite un cadre réglementaire strict pour préserver l'emploi et la vie privée." }, { value: "C", text: "Un vecteur d'automatisation et d'intrusion qui accroît la dépendance des citoyens aux géants technologiques et à la surveillance." } ] },
      { cat: "📰 Médias", q: "Les médias d'information traditionnels (TV, Radio, Presse)", choices: [ { value: "A", text: "Des piliers de la démocratie garantissant un travail d'information vérifié et professionnel." }, { value: "B", text: "Des sources utiles, mais traversées par des lignes éditoriales précises qu'il faut savoir croiser et nuancer." }, { value: "C", text: "Des canaux largement uniformisés par des intérêts financiers ou institutionnels, réduisant la pluralité des analyses." } ] },
      { cat: "🇪🇺 Union Européenne", q: "Les institutions européennes (Union Européenne)", choices: [ { value: "A", text: "Une construction indispensable pour garantir la paix, la stabilité et le poids de l'Europe dans le monde." }, { value: "B", text: "Un projet nécessaire sur le principe, mais dont le fonctionnement trop bureaucratique doit être réformé." }, { value: "C", text: "Une structure supranationale qui dessaisit progressivement les États de leur souveraineté budgétaire et législative." } ] },
      { cat: "🏥 Santé", q: "Le système de santé et les politiques sanitaires", choices: [ { value: "A", text: "Un modèle solidaire efficace qui protège l'ensemble de la population face aux crises et aux risques de la vie." }, { value: "B", text: "Un système de qualité mais sous tension, nécessitant une réorganisation des moyens et de la gestion publique." }, { value: "C", text: "Une gestion de plus en plus centralisée et normée qui favorise les impératifs administratifs et financiers au détriment du bon sens médical." } ] },
      { cat: "📈 Économie", q: "Le fonctionnement de l'économie et de la monnaie", choices: [ { value: "A", text: "Les mécanismes financiers actuels et les banques centrales assurent la stabilité du système monétaire." }, { value: "B", text: "Le système économique est performant mais nécessite une régulation continue pour limiter les excès de la finance." }, { value: "C", text: "Le modèle monétaire basé sur la création de dette et l'inflation grignote continuellement le pouvoir d'achat et la valeur de l'épargne." } ] },
      { cat: "🎓 Éducation", q: "Le système éducatif et la transmission des savoirs", choices: [ { value: "A", text: "Un service public fondamental qui permet l'égalité des chances et la formation des citoyens de demain." }, { value: "B", text: "Une institution aux fondations solides mais confrontée à des défis majeurs d'adaptation et de niveau d'exigence." }, { value: "C", text: "Une baisse progressive du niveau d'exigence académique au profit d'expérimentations pédagogiques ou sociétales." } ] },
      { cat: "⚖️ Justice", q: "Le traitement de la sécurité et de la justice", choices: [ { value: "A", text: "Un cadre républicain qui garantit le respect des droits individuels tout en assurant l'ordre public." }, { value: "B", text: "Des forces de l'ordre et une justice engagées mais qui manquent de moyens matériels et humains pour agir efficacement." }, { value: "C", text: "Une réponse judiciaire souvent perçue comme trop laxiste ou déconnectée de la réalité du terrain et des victimes." } ] },
      { cat: "⚡ Énergie", q: "L'accès à l'énergie et la souveraineté industrielle", choices: [ { value: "A", text: "Une transition nécessaire vers une mixité énergétique guidée par la coopération et les objectifs européens." }, { value: "B", text: "Un enjeu de compétitivité exigeant d'allier mix énergétique réaliste et soutien à l'industrie nationale." }, { value: "C", text: "La dérégulation du marché de l'énergie et l'abandon d'une filière industrielle indépendante coûtent cher à l'économie du pays." } ] }
    ];

    let currentUser = {};
    let currentQuestion = 0;
    let userAnswers = [];
    let myChart = null;

    document.getElementById('user-form').addEventListener('submit', (e) => {
      e.preventDefault();
      currentUser = {
        prenom: document.getElementById('prenom').value,
        nom: document.getElementById('nom').value,
        age: document.getElementById('age').value,
        profession: document.getElementById('profession').value,
        date: new Date().toLocaleDateString('fr-FR')
      };
      currentQuestion = 0;
      userAnswers = [];
      showScreen('screen-2');
      loadQuestion();
    });

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('category-title').innerText = `${q.cat} — Question ${currentQuestion + 1}/12`;
      document.getElementById('question-text').innerText = q.q;
      document.getElementById('progress').style.width = `${((currentQuestion) / 12) * 100}%`;

      // Mélange aléatoire du contenu des propositions
      const shuffledTexts = shuffleArray(q.choices);

      // Attribution stricte et fixe des étiquettes affichées : A, B, C
      const labels = ['A', 'B', 'C'];
      const badgeClasses = ['badge-a', 'badge-b', 'badge-c'];

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      shuffledTexts.forEach((item, index) => {
        const displayLabel = labels[index];
        const badgeClass = badgeClasses[index];

        const button = document.createElement('button');
        button.className = 'option-btn';
        button.onclick = () => selectOption(item.value);
        button.innerHTML = `<span class="badge ${badgeClass}">[${displayLabel}]</span> <span>${item.text}</span>`;
        container.appendChild(button);
      });
    }

    function selectOption(choiceValue) {
      userAnswers.push(choiceValue);
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        finishTest();
      }
    }

    function finishTest() {
      const count = { A: 0, B: 0, C: 0 };
      userAnswers.forEach(ans => count[ans]++);

      let profile = "";
      let desc = "";

      if (count.A >= count.B && count.A >= count.C) {
        profile = "Profil Confiance & Institutions";
        desc = "Vous privilégiez l'innovation, le libre-échange et faites confiance aux structures établies.";
      } else if (count.B >= count.A && count.B >= count.C) {
        profile = "Profil Nuancé & Réformiste";
        desc = "Vous prônez la modération, la régulation et la recherche d'un équilibre social-économique.";
      } else {
        profile = "Profil Lucide & Souverainiste";
        desc = "Vous valorisez l'autonomie, le retour aux valeurs locales et la vigilance institutionnelle.";
      }

      const fullRecord = { ...currentUser, answers: userAnswers, profile: profile };

      let data = JSON.parse(localStorage.getItem('cyril_test_data') || '[]');
      data.push(fullRecord);
      localStorage.setItem('cyril_test_data', JSON.stringify(data));

      document.getElementById('result-profile').innerText = profile;
      document.getElementById('result-desc').innerText = desc;
      showScreen('screen-3');
    }

    function renderChart() {
      const data = JSON.parse(localStorage.getItem('cyril_test_data') || '[]');
      document.getElementById('total-participants').innerText = data.length;

      const profileCounts = { "Profil Confiance & Institutions": 0, "Profil Nuancé & Réformiste": 0, "Profil Lucide & Souverainiste": 0 };
      data.forEach(item => { if (profileCounts[item.profile] !== undefined) profileCounts[item.profile]++; });

      const ctx = document.getElementById('statsChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: Object.keys(profileCounts),
          datasets: [{
            data: Object.values(profileCounts),
            backgroundColor: ['#3b82f6', '#f59e0b', '#ef4444']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#fff' } } }
        }
      });
    }

    function exportCSV() {
      const data = JSON.parse(localStorage.getItem('cyril_test_data') || '[]');
      if (data.length === 0) return alert("Aucune donnée à exporter.");

      let csv = "Date;Prenom;Nom;Age;Profession;Profil;Réponses\n";
      data.forEach(row => {
        csv += `${row.date};${row.prenom};${row.nom};${row.age};${row.profession};"${row.profile}";"${row.answers.join(',')}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "resultats_test_cyril.csv";
      link.click();
    }

    function resetForm() {
      document.getElementById('user-form').reset();
      showScreen('screen-1');
    }
  </script>
</body>
</html>
