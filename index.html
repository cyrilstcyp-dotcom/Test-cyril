<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Le Test Cyril</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #1e293b; border-radius: 20px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1, h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #94a3b8; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1em; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .option-btn { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 12px; text-align: left; color: #fff; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; transition: 0.2s; width: 100%; line-height: 1.4; }
    .option-btn:hover { border-color: #38bdf8; background: #1e293b; }
    .badge { font-weight: bold; padding: 4px 8px; border-radius: 6px; font-size: 0.85em; flex-shrink: 0; }
    .badge-a { background: #3b82f6; color: #fff; }
    .badge-b { background: #f59e0b; color: #fff; }
    .badge-c { background: #ef4444; color: #fff; }
    .progress-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
    .progress-fill { height: 100%; background: #38bdf8; width: 0%; transition: width 0.3s; }
    .screen { display: none; }
    .screen.active { display: block; }
    .result-box { background: #0f172a; padding: 15px; border-radius: 10px; margin: 15px 0; border-left: 4px solid #38bdf8; }
    .stats-container { margin-top: 20px; text-align: center; }
    .question-text { font-size: 1.05em; color: #f1f5f9; margin-bottom: 18px; line-height: 1.4; font-weight: 600; }
  </style>
</head>
<body>

  <div class="card">
    <!-- ÉCRAN 1 : IDENTIFICATION -->
    <div id="screen-1" class="screen active">
      <h1>Le Test Cyril 🚀</h1>
      <form id="user-form">
        <div class="input-group">
          <label>Prénom</label>
          <input type="text" id="prenom" required>
        </div>
        <div class="input-group">
          <label>Nom</label>
          <input type="text" id="nom" required>
        </div>
        <div class="input-group">
          <label>Âge</label>
          <input type="number" id="age" required>
        </div>
        <div class="input-group">
          <label>Profession</label>
          <input type="text" id="profession" required>
        </div>
        <button type="submit" class="btn btn-primary">Commencer le Test</button>
      </form>
    </div>

    <!-- ÉCRAN 2 : QUESTIONNAIRE -->
    <div id="screen-2" class="screen">
      <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
      <h2 id="category-title" style="font-size:0.9em; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; margin-bottom:5px;"></h2>
      <div id="question-text" class="question-text"></div>
      <div id="options-container"></div>
    </div>

    <!-- ÉCRAN 3 : RÉSULTAT INDIVIDUEL -->
    <div id="screen-3" class="screen">
      <h2>Résultat</h2>
      <div class="result-box">
        <h3 id="result-profile"></h3>
        <p id="result-desc" style="margin-top: 8px; font-size: 0.9em; color: #94a3b8;"></p>
      </div>
      <button class="btn btn-primary" onclick="showScreen('screen-4'); renderChart();">Voir les Statistiques Globales</button>
      <button class="btn btn-secondary" onclick="resetForm()">Nouveau Test</button>
    </div>

    <!-- ÉCRAN 4 : DASHBOARD STATISTIQUES -->
    <div id="screen-4" class="screen">
      <h2>Dashboard Global</h2>
      <p style="text-align: center; color: #94a3b8;">Participants totaux : <strong id="total-participants" style="color:#fff;">0</strong></p>
      
      <div class="stats-container">
        <canvas id="statsChart"></canvas>
      </div>

      <button class="btn btn-success" onclick="exportCSV()">Exporter en CSV 📥</button>
      <button class="btn btn-secondary" onclick="resetForm()">Accueil</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const questions = [
      { cat: "🏛️ Politique", q: "Pensez-vous que les institutions politiques actuelles permettent encore de représenter efficacement les citoyens ?", a: "Oui, les institutions fonctionnent bien et garantissent la stabilité.", b: "Partiellement, elles nécessitent des réformes pour donner plus de voix au peuple.", c: "Non, le système est déconnecté et nécessite une refonte globale." },
      { cat: "🇺🇸 USA", q: "Selon vous, l'influence économique et culturelle des États-Unis est-elle bénéfique pour l'Europe ?", a: "Oui, c'est un allié indispensable sur le plan économique et stratégique.", b: "Elle comporte des avantages mais exige un rééquilibrage pour préserver notre autonomie.", c: "Non, c'est une domination qui nuit à l'indépendance de nos nations." },
      { cat: "🌐 Mondialisation", q: "Pensez-vous que l'ouverture des marchés internationaux constitue un atout pour le développement économique ?", a: "Oui, le libre-échange favorise l'innovation et l'accès au plus grand nombre.", b: "Oui, à condition d'imposer des régulations environnementales et sociales stricts.", c: "Non, il faut relocaliser en priorité et protéger nos industries nationales." },
      { cat: "🌱 Climat", q: "Quelle est selon vous la meilleure stratégie pour faire face aux enjeux écologiques et climatiques ?", a: "Faire confiance au progrès technologique et aux mécanismes de marché.", b: "Mettre en place une planification d'État équilibrée sans pénaliser les ménages.", c: "Adopter une sobriété stricte et appliquer un protectionnisme écologique fort." },
      { cat: "🤖 IA", q: "Selon vous, le développement rapide de l'Intelligence Artificielle est-il une opportunité ou un risque ?", a: "C'est une formidable opportunité de progrès et de gains de productivité.", b: "C'est un outil très utile mais qui nécessite un encadrement éthique rigoureux.", c: "C'est une menace grave pour l'emploi, la vie privée et l'autonomie humaine." },
      { cat: "📰 Médias", q: "Pensez-vous que l'information délivrée par les grands médias traditionnels est objective ?", a: "Oui, le travail journalisme garantit une information globale et fiable.", b: "L'information est globalement correcte mais manque parfois de pluralisme.", c: "Non, les grands médias sont trop orientés ou soumis à des intérêts privés/étatiques." },
      { cat: "🇪🇺 Union Européenne", q: "Considérez-vous que l'Union européenne est un avantage direct pour la France et les Français ?", a: "Oui, c'est un cadre indispensable pour la prospérité et la paix.", b: "Oui, mais l'UE doit être réformée pour être plus proche des peuples.", c: "Non, l'UE limite la souveraineté nationale et pèse sur nos décisions." },
      { cat: "🏥 Santé", q: "Comment le système de santé public devrait-il être financé et géré à l'avenir ?", a: "En ouvrant davantage à la concurrence et au partenariat avec le privé.", b: "En visant la gestion publique tout en réorganisant les services en profondeur.", c: "En recentrant les ressources exclusivement sur les besoins vitaux des citoyens." },
      { cat: "📈 Économie", q: "Quelle est la priorité pour dynamiser l'économie et la création d'emplois ?", a: "Réduire les taxes et assouplir la réglementation pour libérer l'entreprise.", b: "Soutenir la consommation tout en assurant une juste redistribution des richesses.", c: "Protéger le marché intérieur et imposer des barrières tarifaires aux importations." },
      { cat: "🎓 Éducation", q: "Selon vous, quelle doit être la mission prioritaire de l'école républicaine ?", a: "Adapter l'enseignement aux nouvelles technologies et aux besoins des entreprises.", b: "Réduire les inégalités et garantir l'égalité des chances pour chaque élève.", c: "Rétablir l'autorité, la discipline et l'apprentissage des savoirs fondamentaux." },
      { cat: "⚖️ Justice", q: "Quelle orientation la politique pénale et judiciaire doit-elle adopter en priorité ?", a: "Miser sur la prévention, l'accompagnement et les peines d'aménagement.", b: "Maintenir un équilibre strict entre fermeté des sanctions et réinsertion.", c: "Appliquer une fermeté absolue avec des peines planchers et de nouvelles prisons." },
      { cat: "⚡ Énergie", q: "Comment la France doit-elle garantir son indépendance énergétique ?", a: "En accélérant massivement le développement des énergies renouvelables.", b: "En conservant un mix équilibré entre énergie nucléaire et renouvelable.", c: "En investissant en priorité sur le nucléaire pour garantir une souveraineté totale." }
    ];

    let currentUser = {};
    let currentQuestion = 0;
    let userAnswers = [];
    let myChart = null;

    document.getElementById('user-form').addEventListener('submit', (e) => {
      e.preventDefault();
      currentUser = {
        prenom: document.getElementById('prenom').value,
        nom: document.getElementById('nom').value,
        age: document.getElementById('age').value,
        profession: document.getElementById('profession').value,
        date: new Date().toLocaleDateString('fr-FR')
      };
      currentQuestion = 0;
      userAnswers = [];
      showScreen('screen-2');
      loadQuestion();
    });

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('category-title').innerText = `${q.cat} — Question ${currentQuestion + 1}/12`;
      document.getElementById('question-text').innerText = q.q;
      document.getElementById('progress').style.width = `${((currentQuestion) / 12) * 100}%`;

      let options = [
        { type: 'A', text: q.a },
        { type: 'B', text: q.b },
        { type: 'C', text: q.c }
      ];

      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      options.forEach(opt => {
        let badgeClass = opt.type === 'A' ? 'badge-a' : (opt.type === 'B' ? 'badge-b' : 'badge-c');
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.onclick = () => selectOption(opt.type);
        button.innerHTML = `<span class="badge ${badgeClass}">[${opt.type}]</span> <span>${opt.text}</span>`;
        container.appendChild(button);
      });
    }

    function selectOption(choice) {
      userAnswers.push(choice);
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        finishTest();
      }
    }

    function finishTest() {
      const count = { A: 0, B: 0, C: 0 };
      userAnswers.forEach(ans => count[ans]++);

      let profile = "";
      let desc = "";

      if (count.A >= count.B && count.A >= count.C) {
        profile = "Profil Confiance & Institutions";
        desc = "Vous privilégiez l'innovation, le libre-échange et faites confiance aux structures établies.";
      } else if (count.B >= count.A && count.B >= count.C) {
        profile = "Profil Nuancé & Réformiste";
        desc = "Vous prônez la modération, la régulation et la recherche d'un équilibre social-économique.";
      } else {
        profile = "Profil Lucide & Souverainiste";
        desc = "Vous valorisez l'autonomie, le retour aux valeurs locales et la vigilance institutionnelle.";
      }

      const fullRecord = { ...currentUser, answers: userAnswers, profile: profile };

      let data = JSON.parse(localStorage.getItem('cyril_test_data') || '[]');
      data.push(fullRecord);
      localStorage.setItem('cyril_test_data', JSON.stringify(data));

      document.getElementById('result-profile').innerText = profile;
      document.getElementById('result-desc').innerText = desc;
      showScreen('screen-3');
    }

    function renderChart() {
      const data = JSON.parse(localStorage.getItem('cyril_test_data') || '[]');
      document.getElementById('total-participants').innerText = data.length;

      const profileCounts = { "Profil Confiance & Institutions": 0, "Profil Nuancé & Réformiste": 0, "Profil Lucide & Souverainiste": 0 };
      data.forEach(item => { if (profileCounts[item.profile] !== undefined) profileCounts[item.profile]++; });

      const ctx = document.getElementById('statsChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: Object.keys(profileCounts),
          datasets: [{
            data: Object.values(profileCounts),
            backgroundColor: ['#3b82f6', '#f59e0b', '#ef4444']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#fff' } } }
        }
      });
    }

    function exportCSV() {
      const data = JSON.parse(localStorage.getItem('cyril_test_data') || '[]');
      if (data.length === 0) return alert("Aucune donnée à exporter.");

      let csv = "Date;Prenom;Nom;Age;Profession;Profil;Réponses\n";
      data.forEach(row => {
        csv += `${row.date};${row.prenom};${row.nom};${row.age};${row.profession};"${row.profile}";"${row.answers.join(',')}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "resultats_test_cyril.csv";
      link.click();
    }

    function resetForm() {
      document.getElementById('user-form').reset();
      showScreen('screen-1');
    }
  </script>
</body>
</html>
