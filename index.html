<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Sondage</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 25px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #2563eb; border: none; font-weight: bold; cursor: pointer; }
        .screen { display: none; }
        .screen.active { display: block; }
        .opt { background: #334155; padding: 10px; margin: 8px 0; border-radius: 8px; cursor: pointer; }
        .opt.selected { background: #2563eb; }
    </style>
</head>
<body>

<div class="box">
    <div id="s1" class="screen active">
        <h2>Vos informations</h2>
        <input type="text" id="nom" placeholder="Nom">
        <input type="text" id="prenom" placeholder="Prénom">
        <input type="number" id="age" placeholder="Âge">
        <input type="text" id="metier" placeholder="Métier">
        <button onclick="lancerSondage()">Commencer</button>
    </div>

    <div id="s2" class="screen">
        <h3 id="qTitre">Question</h3>
        <div id="qOpts"></div>
        <button id="btnSuivant" onclick="suiv()" style="display:none;">Suivant</button>
    </div>

    <div id="s3" class="screen">
        <h2>Terminé !</h2>
        <p id="msgFin"></p>
        <button onclick="location.reload()">Recommencer</button>
    </div>
</div>

<script>
    const questions = [
        { t: "1. L'Union européenne", opts: [{id:"A", l:"Imparfaite"}, {id:"B", l:"Destructrice"}, {id:"C", l:"Indispensable"}] },
        { t: "2. Le conflit Ukraine", opts: [{id:"A", l:"Opposition"}, {id:"B", l:"Soutien total"}, {id:"C", l:"Nuancé"}] },
        { t: "3. L'immigration", opts: [{id:"A", l:"A encadrer"}, {id:"B", l:"Opportunité"}, {id:"C", l:"Menace"}] },
        { t: "4. Le climat", opts: [{id:"A", l:"Fiscalité"}, {id:"B", l:"Menace réelle"}, {id:"C", l:"Exagéré"}] },
        { t: "5. Les États-Unis", opts: [{id:"A", l:"Déstabilisatrice"}, {id:"B", l:"Ambivalent"}, {id:"C", l:"Indispensable"}] },
        { t: "6. La justice", opts: [{id:"A", l:"Réinsertion"}, {id:"B", l:"Fermeté"}, {id:"C", l:"Réparation"}] },
        { t: "7. Justice à deux vitesses", opts: [{id:"A", l:"Inégalitaire"}, {id:"B", l:"Liée à l'argent"}, {id:"C", l:"Équitable"}] },
        { t: "8. Gestion Covid", opts: [{id:"A", l:"Pragmatique"}, {id:"B", l:"Manipulation"}, {id:"C", l:"Rigide"}] },
        { t: "9. Alunissage 1969", opts: [{id:"A", l:"Mise en scène"}, {id:"B", l:"Prouesse avérée"}, {id:"C", l:"Exploit réel"}] },
        { t: "10. Liberté d'expression", opts: [{id:"A", l:"Sous contrôle"}, {id:"B", l:"À réguler"}, {id:"C", l:"Liberté persiste"}] },
        { t: "11. Rôle des politiques", opts: [{id:"A", l:"Marges de manœuvre"}, {id:"B", l:"Impuissants"}, {id:"C", l:"Manque de courage"}] },
        { t: "12. Dette et cash", opts: [{id:"A", l:"Progrès"}, {id:"B", l:"Manque de rigueur"}, {id:"C", l:"Contrôle total"}] },
        { t: "13. Identité numérique", opts: [{id:"A", l:"Contrôle total"}, {id:"B", l:"Sécurité"}, {id:"C", l:"Progrès encadré"}] },
        { t: "14. Alimentation et santé", opts: [{id:"A", l:"Emprise pharma"}, {id:"B", l:"Système sûr"}, {id:"C", l:"Choix individuel"}] },
        { t: "15. Éducation nationale", opts: [{id:"A", l:"Formatage"}, {id:"B", l:"Égalité des chances"}, {id:"C", l:"Dépassée"}] }
    ];

    let user = {};
    let idx = 0;
    let ans = {};

    function lancerSondage() {
        user.nom = document.getElementById('nom').value;
        user.prenom = document.getElementById('prenom').value;
        user.age = document.getElementById('age').value;
        user.metier = document.getElementById('metier').value;

        if(!user.nom || !user.prenom) { alert('Mettez au moins le nom et prénom'); return; }

        document.getElementById('s1').classList.remove('active');
        document.getElementById('s2').classList.add('active');
        chargerQ();
    }

    function chargerQ() {
        let q = questions[idx];
        document.getElementById('qTitre').innerText = q.t;
        let c = document.getElementById('qOpts');
        c.innerHTML = "";
        document.getElementById('btnSuivant').style.display = "none";

        q.opts.forEach(o => {
            let div = document.createElement('div');
            div.className = "opt" + (ans[idx] === o.id ? " selected" : "");
            div.innerText = o.id + ") " + o.l;
            div.onclick = () => {
                ans[idx] = o.id;
                chargerQ();
                document.getElementById('btnSuivant').style.display = "block";
            };
            c.appendChild(div);
        });
    }

    function suiv() {
        if(idx < questions.length - 1) {
            idx++;
            chargerQ();
        } else {
            fin();
        }
    }

    function fin() {
        document.getElementById('s2').classList.remove('active');
        document.getElementById('s3').classList.add('active');
        document.getElementById('msgFin').innerText = "Merci " + user.prenom + ", envoi des données en cours...";

        // URL GOOGLE SCRIPT ACTUELLE
        const url = "https://script.google.com/macros/s/AKfycbxJthMTBxJpmViCkIRzNzpiqBF3-Nh3RkTAt6M0GS7-WOoyqblhDNFEE-pZ3QC34kaHgw/exec";

        let params = new URLSearchParams();
        params.append("nom", user.nom);
        params.append("prenom", user.prenom);
        params.append("age", user.age);
        params.append("metier", user.metier);
        params.append("profil", "Sondage Terminé");

        for(let i=0; i<15; i++) {
            params.append("q" + (i+1), ans[i] || "");
        }

        fetch(url, {
            method: "POST",
            mode: "no-cors",
            body: params
        }).then(() => {
            document.getElementById('msgFin').innerText = "Merci " + user.prenom + ", vos réponses sont enregistrées !";
        }).catch(() => {
            document.getElementById('msgFin').innerText = "Erreur d'envoi.";
        });
    }
</script>

</body>
</html>
